<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Embedded PDF Viewer</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
        }
        .container {
            max-width: 900px;
            margin: 30px auto;
            padding: 20px;
            background: #ffffff;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            border-radius: 8px;
        }
        h1 {
            color: #333;
            text-align: center;
        }
        .pdf-container {
            position: relative;
            width: 100%;
            height: 700px; /* Adjust height as needed */
            margin-top: 20px;
        }
        object {
            width: 100%;
            height: 100%;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .fallback-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            padding: 15px;
            background-color: #ffebe8;
            color: #d9381e;
            border: 1px solid #f5c2c2;
            border-radius: 4px;
            text-decoration: none;
            font-weight: bold;
        }
        .fallback-link:hover {
            background-color: #fddcd7;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Document Viewer</h1>
        
        <div class="pdf-container">
            <!-- Embedding the PDF using the <object> tag -->
            <object data="your-file.pdf" type="application/pdf">
                <!-- Fallback content if the browser cannot display the PDF natively -->
                <a class="fallback-link" href="BrianPhilippus.pdf" target="_blank">
                    Your browser does not support inline PDFs. Click here to download or view the PDF.
                </a>
            </object>
        </div>
    </div>

</body>
</html>
